# =============================================================================
# Capteurs dérivés - référence batterie = JK BMS (RS485)
#   - puissance JK lissée (table circulaire, fenêtre/intervalle réglables)
#   - maison = sortie AC onduleur (estimée) + circuit DC (bilan du bus DC)
#   - énergies JK chargée/déchargée cumulées (Wh, tableau de bord Énergie HA)
#   - énergie restante / nominale JK (Wh)
#   - temps restant estimé (min) + heure estimée de fin de charge / décharge,
#     pour le JK et le JBD. En DÉCHARGE seule la partie utile compte :
#     utile = restante - nominale x "Réserve décharge" (défaut 20 %).
#     Ex. 1 kWh, 800 Wh restants, réserve 20 % -> 600 Wh utiles ; à 100 W
#     -> 360 min ; à 06:39 -> "Déchargée vers 12:39". En CHARGE aucune
#     compensation : (nominale - restante) / puissance de charge.
#   - énergies JBD chargée/déchargée (inchangées, le JBD reste en BLE)
#
# Aucune autre mesure de tension batterie n'est utilisée que jk_voltage.
# =============================================================================

globals:
  - id: pw_avg_buffer
    type: float[100]
  - id: pw_avg_idx
    type: int
    initial_value: '0'
  - id: pw_avg_count
    type: int
    initial_value: '0'
  - id: pw_avg_last_ms
    type: uint32_t
    initial_value: '0'
  # Puissance JBD lissée (moyenne exponentielle) pour ses estimations
  - id: jbd_pw_ema
    type: float
    initial_value: 'NAN'

number:
  # Réserve non utilisée en décharge (% de la capacité nominale)
  - platform: template
    name: "JK Réserve décharge"
    id: jk_reserve_pct
    unit_of_measurement: "%"
    min_value: 0
    max_value: 90
    step: 1
    initial_value: 20
    optimistic: true
    restore_value: true
    entity_category: config
    mode: box
    icon: "mdi:battery-lock"
  - platform: template
    name: "JBD Réserve décharge"
    id: jbd_reserve_pct
    unit_of_measurement: "%"
    min_value: 0
    max_value: 90
    step: 1
    initial_value: 20
    optimistic: true
    restore_value: true
    entity_category: config
    mode: box
    icon: "mdi:battery-lock"
  - platform: template
    name: "JK Lissage Fenêtre"
    id: pw_avg_window
    min_value: 1
    max_value: 100
    step: 1
    initial_value: 100
    restore_value: true
    optimistic: true
    entity_category: config
    mode: box
    icon: "mdi:chart-bell-curve"
  - platform: template
    name: "JK Lissage Intervalle"
    id: pw_avg_interval
    min_value: 1
    max_value: 30
    step: 1
    initial_value: 1
    restore_value: true
    optimistic: true
    entity_category: config
    unit_of_measurement: s
    mode: box
    icon: "mdi:timer-outline"

sensor:
  # Puissance JK signée (+ = charge) lissée : une lecture par intervalle dans
  # une table de 100 cases, moyenne des N plus récentes (N = fenêtre).
  - platform: template
    name: "JK Puissance moyenne"
    id: battery_power_avg
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      float v = id(jk_power).state;
      if (isnan(v)) return {};
      uint32_t now = millis();
      uint32_t interval_ms = (uint32_t) id(pw_avg_interval).state * 1000;
      if (interval_ms < 1000) interval_ms = 1000;
      if (id(pw_avg_count) > 0 && (now - id(pw_avg_last_ms)) < interval_ms)
        return {};
      id(pw_avg_last_ms) = now;
      id(pw_avg_buffer)[id(pw_avg_idx)] = v;
      id(pw_avg_idx) = (id(pw_avg_idx) + 1) % 100;
      if (id(pw_avg_count) < 100)
        id(pw_avg_count) += 1;
      int window = (int) id(pw_avg_window).state;
      if (window < 1) window = 1;
      if (window > 100) window = 100;
      int n = id(pw_avg_count) < window ? id(pw_avg_count) : window;
      float sum = 0;
      int pos = id(pw_avg_idx);
      for (int i = 0; i < n; i++) {
        pos = (pos + 99) % 100;
        sum += id(pw_avg_buffer)[pos];
      }
      return sum / n;

  # --- Consommation maison = sortie AC de l'onduleur + circuit DC ---------
  # Circuit DC (bilan du bus DC) : ce qui entre dans le bus (PV2 PowerMr +
  # injection de l'onduleur) moins ce qui va dans la batterie (JK, + = charge).
  - platform: template
    name: "Circuit DC Puissance"
    id: dc_load_power
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    icon: "mdi:current-dc"
    lambda: |-
      float pv2 = id(pv2_power_production).state;
      float inj = id(inv_power_in).state;
      float bat = id(jk_power).state;
      if (isnan(bat) || isnan(inj)) return {};
      if (isnan(pv2)) pv2 = 0;
      float p = pv2 + inj - bat;
      return p < 0 ? 0 : p;

  # Sortie AC estimée de l'onduleur : (PV1 + ce qu'il tire du bus DC - ce
  # qu'il y injecte) x rendement. "Onduleur Puissance" est signée (+ tiré).
  - platform: template
    name: "Maison AC Puissance"
    id: house_ac_power
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    icon: "mdi:power-socket"
    lambda: |-
      float inv = id(inv_power).state;
      if (isnan(inv)) return {};
      float pv = id(pv_power).state;
      if (isnan(pv)) pv = 0;
      float eff = id(inv_efficiency).state;
      if (isnan(eff)) eff = 90;
      float p = (pv + inv) * eff / 100.0f;
      return p < 0 ? 0 : p;

  # Consommation totale de la maison = AC + DC
  - platform: template
    name: "Maison Puissance"
    id: house_power
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      float ac = id(house_ac_power).state;
      float dc = id(dc_load_power).state;
      if (isnan(ac) && isnan(dc)) return {};
      return (isnan(ac) ? 0 : ac) + (isnan(dc) ? 0 : dc);

  - platform: integration
    name: "Maison AC Énergie"
    id: house_ac_energy
    sensor: house_ac_power
    time_unit: h
    restore: true
    device_class: energy
    state_class: total_increasing
    unit_of_measurement: Wh
    accuracy_decimals: 0
  - platform: integration
    name: "Circuit DC Énergie"
    id: dc_load_energy
    sensor: dc_load_power
    time_unit: h
    restore: true
    device_class: energy
    state_class: total_increasing
    unit_of_measurement: Wh
    accuracy_decimals: 0

  - platform: integration
    name: "Maison Énergie"
    id: house_energy
    sensor: house_power
    time_unit: h
    restore: true
    device_class: energy
    state_class: total_increasing
    unit_of_measurement: Wh
    accuracy_decimals: 0

  # Énergie restante JK (Wh) = capacité restante (Ah) x tension JK
  - platform: template
    name: "JK Énergie restante"
    id: battery_remaining_wh
    unit_of_measurement: Wh
    device_class: energy_storage
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      float ah = id(jk_capacity_remaining).state;
      float v = id(jk_voltage).state;
      if (isnan(ah) || isnan(v)) return {};
      return ah * v;

  # Énergie nominale JK (Wh) = capacité nominale réglée dans le JK (trame
  # réglages 0x01) x tension. Jamais déduite du SoC : tant que la trame
  # réglages n'est pas reçue, la valeur reste inconnue (pas d'estimation).
  - platform: template
    name: "JK Énergie nominale"
    id: battery_nominal_energy_wh
    unit_of_measurement: Wh
    device_class: energy_storage
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      float v = id(jk_voltage).state;
      float nom_ah = id(jk_capacity_total).state;
      if (isnan(v) || isnan(nom_ah) || nom_ah <= 0) return {};
      return nom_ah * v;

  - platform: integration
    name: "JK Énergie chargée"
    id: battery_energy_charged
    sensor: jk_power_charging
    time_unit: h
    restore: true
    device_class: energy
    state_class: total_increasing
    unit_of_measurement: Wh
    accuracy_decimals: 0
  - platform: integration
    name: "JK Énergie déchargée"
    id: battery_energy_discharged
    sensor: jk_power_discharging
    time_unit: h
    restore: true
    device_class: energy
    state_class: total_increasing
    unit_of_measurement: Wh
    accuracy_decimals: 0

  # Temps restant estimé (min) : > 0 = décharge (jusqu'à la réserve),
  # < 0 = temps de charge restant, 0 = ni charge ni décharge.
  - platform: template
    name: "JK Temps restant estimé"
    id: battery_time_remaining
    unit_of_measurement: min
    icon: "mdi:timer-sand"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      float v = id(jk_voltage).state;
      float rem_ah = id(jk_capacity_remaining).state;
      float nom_wh = id(battery_nominal_energy_wh).state;
      float p = id(battery_power_avg).state;      // + = charge
      if (isnan(v) || isnan(rem_ah) || isnan(nom_wh) || isnan(p)) return {};
      float rem_wh = rem_ah * v;
      if (p < -1.0f) {
        float reserve = id(jk_reserve_pct).state;
        if (isnan(reserve)) reserve = 20;
        float usable = rem_wh - nom_wh * reserve / 100.0f;
        if (usable <= 0) return 0.0f;             // déjà dans la réserve
        return usable / (-p) * 60.0f;
      } else if (p > 1.0f) {
        float missing = nom_wh - rem_wh;
        if (missing <= 0) return 0.0f;
        return -(missing / p * 60.0f);
      }
      return 0.0f;

  # --- JBD (BLE, inchangé) : énergies cumulées ---
  - platform: integration
    name: "Batterie Énergie chargée"
    id: jbd_energy_charged
    sensor: jbd_charging_power
    time_unit: h
    restore: true
    device_class: energy
    state_class: total_increasing
    unit_of_measurement: Wh
    accuracy_decimals: 0
  - platform: integration
    name: "Batterie Énergie déchargée"
    id: jbd_energy_discharged
    sensor: jbd_discharging_power
    time_unit: h
    restore: true
    device_class: energy
    state_class: total_increasing
    unit_of_measurement: Wh
    accuracy_decimals: 0

  # --- JBD : temps restant estimé (même calcul que le JK, réserve JBD) ---
  - platform: template
    name: "Batterie Temps restant estimé"
    id: jbd_time_remaining
    unit_of_measurement: min
    icon: "mdi:timer-sand"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      float pw = id(jbd_power).state;
      if (isnan(pw)) return {};
      // Lissage exponentiel (~1 min) pour éviter une estimation qui saute
      if (isnan(id(jbd_pw_ema))) id(jbd_pw_ema) = pw;
      id(jbd_pw_ema) = id(jbd_pw_ema) * 0.92f + pw * 0.08f;
      float p = id(jbd_pw_ema);
      float v = id(jbd_voltage).state;
      float rem_ah = id(jbd_capacity_remaining).state;
      float nom_ah = id(jbd_nominal_capacity).state;
      if (isnan(v) || isnan(rem_ah) || isnan(nom_ah) || nom_ah <= 0) return {};
      float rem_wh = rem_ah * v, nom_wh = nom_ah * v;
      if (p < -1.0f) {
        float reserve = id(jbd_reserve_pct).state;
        if (isnan(reserve)) reserve = 20;
        float usable = rem_wh - nom_wh * reserve / 100.0f;
        if (usable <= 0) return 0.0f;
        return usable / (-p) * 60.0f;
      } else if (p > 1.0f) {
        float missing = nom_wh - rem_wh;
        if (missing <= 0) return 0.0f;
        return -(missing / p * 60.0f);
      }
      return 0.0f;

# Heure estimée de fin de charge / décharge (heure locale, NTP)
text_sensor:
  - platform: template
    name: "JK Heure fin estimée"
    id: jk_finish_time
    icon: "mdi:clock-end"
    update_interval: 30s
    lambda: |-
      float m = id(battery_time_remaining).state;
      auto now = id(sntp_time).now();
      if (isnan(m) || m == 0 || !now.is_valid()) return {"—"};
      if (fabsf(m) > 7 * 24 * 60) return {m > 0 ? "Décharge > 7 j" : "Charge > 7 j"};
      auto t = ESPTime::from_epoch_local(now.timestamp + (time_t) (fabsf(m) * 60.0f));
      char hm[16];
      t.strftime(hm, sizeof(hm), t.day_of_year == now.day_of_year ? "%H:%M" : "%d/%m %H:%M");
      return {std::string(m > 0 ? "Déchargée vers " : "Chargée vers ") + hm};
  - platform: template
    name: "Batterie Heure fin estimée"
    id: jbd_finish_time
    icon: "mdi:clock-end"
    update_interval: 30s
    lambda: |-
      float m = id(jbd_time_remaining).state;
      auto now = id(sntp_time).now();
      if (isnan(m) || m == 0 || !now.is_valid()) return {"—"};
      if (fabsf(m) > 7 * 24 * 60) return {m > 0 ? "Décharge > 7 j" : "Charge > 7 j"};
      auto t = ESPTime::from_epoch_local(now.timestamp + (time_t) (fabsf(m) * 60.0f));
      char hm[16];
      t.strftime(hm, sizeof(hm), t.day_of_year == now.day_of_year ? "%H:%M" : "%d/%m %H:%M");
      return {std::string(m > 0 ? "Déchargée vers " : "Chargée vers ") + hm};
