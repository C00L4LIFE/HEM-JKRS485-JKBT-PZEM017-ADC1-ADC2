# =============================================================================
# Système : OTA, serveur web, temps (NTP), LED de statut,
# capteurs système (heap, uptime, température)
# (les capteurs réseau vivent dans packages/wifi.yaml, la version dans
# packages/version.yaml)
# =============================================================================

ota:
  - platform: esphome
    password: !secret ota_password
    # Libérer la liaison BLE JK pendant la mise à jour (moins de charge radio)
    on_begin:
      then:
        - switch.turn_off: jk_ble_connect

safe_mode:

# Sauvegarde NVS des compteurs d'énergie (voir packages/pzem017_solar.yaml) :
# écriture flash au plus toutes les 6h (usure négligeable) + flush automatique
# au shutdown propre (OTA, restart) par le syncer de préférences. Pattern
# repris de esphome-jk-bms_mod (commit c239f20).
preferences:
  flash_write_interval: 6h

# Serveur web embarqué (remplace web_server.cpp + HTML custom)
web_server:
  port: 80
  version: 3
  local: true

# --- I2C : ADS1115 (packages/ads1115_adc.yaml) ---
i2c:
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  scan: true

# --- Temps : NTP seul pour le moment ---
# Pas de RTC DS3231 : l'heure n'est disponible qu'après la synchro NTP
# (quelques secondes après connexion WiFi).
time:
  - platform: sntp
    id: sntp_time
    # Fuseau auto-détecté à la compilation (America/Port-au-Prince sur ce PC).
    # Pour forcer : timezone: Europe/Paris (défaut du projet d'origine)
    servers:
      - pool.ntp.org
      - time.nist.gov
      - time.google.com

# --- LED de statut (GPIO2, clignote en cas de problème) ---
status_led:
  pin: ${status_led_pin}

# --- Debug (heap libre, temps de boucle) ---
debug:
  update_interval: 30s

sensor:
  # Capteurs réseau (RSSI, qualité, IP/MAC/SSID/BSSID/DNS, nom d'hôte) :
  # voir packages/wifi.yaml.
  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    update_interval: 30s
  - platform: debug
    free:
      name: "Heap libre"
    loop_time:
      name: "Temps de boucle"
  - platform: internal_temperature
    name: "Température ESP32"

button:
  - platform: restart
    name: "Redémarrer"
    id: hem_restart
  - platform: safe_mode
    name: "Redémarrer en mode sans échec"
