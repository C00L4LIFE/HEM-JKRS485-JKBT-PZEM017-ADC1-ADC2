# =============================================================================
# JK BMS (JK-PB / v19, protocole JK02_32S) sur RS485 - ÉCOUTE SEULE
#
# Réutilise le port de l'ancien eSmart3 (même MAX485) : RX 16, DE/RE 4.
# Composant txubelaxu/esphome-jk-bms (jk_rs485_sniffer + jk_rs485_bms) :
# décode les trames 0x55AA EB90 (types 01 = réglages, 02 = cellules/état)
# que le JK publie sur son bus RS485 interne (port "parallèle", RJ45).
#
# Écoute seule garantie à DEUX niveaux :
#   1. Matériel : DE/RE (GPIO4) forcé BAS en permanence -> le MAX485 est en
#      réception, son driver est désactivé : aucun octet ne peut sortir sur A/B.
#   2. Logiciel : UART déclaré sans tx_pin et sniffer sans talk_pin. Si le
#      composant décide de jouer les "pseudo-maîtres" (il le fait quand il
#      n'entend aucun maître), ses écritures ne sortent nulle part.
#
# Pré-requis côté BMS (à régler une fois avec l'app JK via Bluetooth) :
#   - DIP switches à 0x00 (tous OFF) : le JK est MAÎTRE et publie lui-même
#     ses trames sur le bus. En esclave (adresse 1-15), il attendrait qu'un
#     maître l'interroge : rien à écouter.
#   - Brancher le MAX485 sur l'un des 2 RJ45 "RS485" (bus parallèle), 115200 bauds :
#     broches 1 = B, 2 = A, 3 = GND (ou 9/10/11 sur le second connecteur).
#   - Limite connue en écoute seule : la trame "infos appareil" (type 03 :
#     modèle, versions hw/sw, n° de série) n'est jamais émise par le maître ;
#     ces infos restent lisibles via le Bluetooth (packages/jk_bms_ble_config.yaml).
#
# C'est CE package qui fournit la référence tension batterie du système
# (jk_voltage) : plus aucune autre mesure de tension batterie n'est utilisée.
# =============================================================================

uart:
  - id: uart_jk
    rx_pin: ${jk_rx_pin}
    # Pas de tx_pin : écoute seule (voir en-tête).
    baud_rate: 115200
    rx_buffer_size: 1024

# DE/RE du MAX485 maintenu à 0 = réception uniquement.
switch:
  - platform: gpio
    id: jk_rs485_de
    pin: ${jk_de_pin}
    restore_mode: ALWAYS_OFF
    internal: true
  # Déclaré SANS aucune entité : jk_rs485_bms.h inclut toujours ses
  # sous-plateformes switch/number, qui ne sont compilées que si la plateforme
  # est déclarée. Aucune commande n'est exposée (écoute seule).
  - platform: jk_rs485_bms
    jk_rs485_bms_id: jk_bms

number:
  - platform: jk_rs485_bms
    jk_rs485_bms_id: jk_bms
    # OBLIGATOIRE : le composant ne décode les trames cellules (0x02 :
    # tension, courant, SoC, cellules...) que si ce number existe - il y lit
    # le nombre de cellules issu de la trame réglages (0x01). Interne : pas
    # d'entité HA, et aucune écriture possible (écoute seule).
    cell_count_settings:
      name: "JK Nombre de cellules (réglage)"
      internal: true

jk_rs485_sniffer:
  - id: jk_sniffer
    protocol_version: ${jk_protocol_version}
    uart_id: uart_jk
    rx_timeout: 50ms

jk_rs485_bms:
  - id: jk_bms
    rs485_address: ${jk_rs485_address}
    jk_rs485_sniffer_id: jk_sniffer
    update_interval: 5s

